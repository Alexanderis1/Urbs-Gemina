# Belief layers: per H3 cell a mean, a variance and the time of the last update.
# The grid resolution comes from config/areas.yaml (grid.city_resolution).
#
# Field meanings, the same for every layer:
#   entity_types / value_key   which Observation records feed the layer and which value to read
#   prior                      what we believe with no readings at all (constant, or one mean per hour, Rome local time)
#   correlation_length_km      how far one reading spreads to neighbouring cells (e^-1 of its weight at this distance)
#   relax_tau_hours            how fast a cell forgets a reading and drifts back to the prior when the feed is silent
#   min_value                  physical lower bound, used to clip the shown range (p5)
#   calibration                "loso" = leave-one-station-out check on real stations; "none" = always "uncalibrated"
#   sources                    layer names in config/providers.yaml whose readings are fused into this layer;
#                              each reading is weighted by its own sigma, so precise stations count more
#   prior_field                optional real gridded map (from a provider) used as the starting point cell by cell
#   allow_simulated            project rule (Alessandro, 13 Nov 2026): only road loops may be simulated. Every
#                              other layer refuses synthetic readings and is built from real sensors and models.
# Every number below is an assumption until checked against data, and says so in "basis".

layers:
  road_speed:
    sources:
      - traffic_flow            # sim_loops: the one simulated input
      - layer: transit          # real GTFS-RT bus positions with speed (about 260 of 1,234 buses report it)
        entity_types: [Vehicle]
        value_key: speed_kmh
        extra_sd: 10            # assumption (C=40): a bus's instant speed is a rough proxy for car speed (bus lanes, stops)
        drop_below: 3           # a bus standing at a stop says nothing about traffic
    allow_simulated: true   # the only simulated input allowed: Roma Mobilita loop data is not public
    unit: km/h
    entity_types: [TrafficFlowObserved]
    value_key: averageVehicleSpeed
    prior:
      # City-wide average speed by hour; to be replaced by free-flow speed per road class
      # once the road graph is ingested.
      mean_by_hour: [42, 44, 45, 45, 44, 40, 33, 26, 22, 25, 29, 30,
                     29, 29, 30, 29, 27, 24, 22, 24, 29, 34, 38, 40]
      sd: 12
      basis: "assumption: typical urban arterial speeds with two rush-hour dips; sd covers road-class spread"
    correlation_length_km: 0.8
    relax_tau_hours: 0.5
    min_value: 0
    calibration: {method: loso, note: "only meaningful once real loop data (pa_datex) replaces sim_loops"}
    basis: "assumption: congestion is correlated along about one km of street network; it changes within half an hour"

  air_no2:
    sources: [air_quality]   # EEA/ARPA Lazio stations (real). Sensor.Community has no NO2.
    prior_field: {source: air_quality_model, entity_types: [AirQualityForecast], value_key: no2, method: idw}
    wind: {source: weather_forecast, max_stretch: 2.0, full_at_ms: 5.0}   # assumption (C=65): plumes spread twice as far along a 5 m/s wind as across it   # CAMS forecast via Open-Meteo, 0.1 deg lattice
    unit: ug/m3
    entity_types: [AirQualityObserved]
    value_key: no2
    prior:
      mean: 30
      sd: 15
      basis: "assumption: Rome annual NO2 is around 20-45 ug/m3 at urban stations; to be replaced by the Open-Meteo/CAMS forecast"
    correlation_length_km: 3.0
    relax_tau_hours: 3.0
    min_value: 0
    calibration: {method: loso, note: ""}
    basis: "assumption: urban NO2 background varies over a few km; hourly values persist a few hours"

  air_pm10:
    sources: [air_quality, air_quality_citizen]   # EEA stations + Sensor.Community (40% sigma, doubled at humidity >= 80%)
    prior_field: {source: air_quality_model, entity_types: [AirQualityForecast], value_key: pm10, method: idw}
    wind: {source: weather_forecast, max_stretch: 2.0, full_at_ms: 5.0}   # assumption (C=65): plumes spread twice as far along a 5 m/s wind as across it
    unit: ug/m3
    entity_types: [AirQualityObserved]
    value_key: pm10
    prior:
      mean: 25
      sd: 12
      basis: "assumption: Rome annual PM10 is around 20-30 ug/m3; to be replaced by the CAMS forecast"
    correlation_length_km: 6.0
    relax_tau_hours: 6.0
    min_value: 0
    calibration: {method: loso, note: ""}
    basis: "assumption: PM10 is more regional than NO2, so it spreads further and lasts longer"

  air_pm25:
    sources: [air_quality, air_quality_citizen]   # EEA stations + Sensor.Community (40% sigma, doubled at humidity >= 80%)
    prior_field: {source: air_quality_model, entity_types: [AirQualityForecast], value_key: pm25, method: idw}
    wind: {source: weather_forecast, max_stretch: 2.0, full_at_ms: 5.0}   # assumption (C=65): plumes spread twice as far along a 5 m/s wind as across it
    unit: ug/m3
    entity_types: [AirQualityObserved]
    value_key: pm25
    prior:
      mean: 14
      sd: 7
      basis: "assumption: Rome annual PM2.5 is around 10-18 ug/m3; to be replaced by the CAMS forecast"
    correlation_length_km: 8.0
    relax_tau_hours: 6.0
    min_value: 0
    calibration: {method: loso, note: ""}
    basis: "assumption: PM2.5 is largely regional background"

  transit_delay:
    sources: [transit]       # GTFS-RT trip updates (real)
    unit: s
    entity_types: [PublicTransportDelayObserved]
    value_key: delay
    prior:
      mean: 120
      sd: 180
      basis: "assumption: a few minutes of typical bus delay in Rome; to be replaced by delay by line and hour once history exists"
    correlation_length_km: 0.6
    relax_tau_hours: 0.5
    min_value: -600
    calibration: {method: loso, note: ""}
    basis: "assumption: delays are shared by buses on the same few streets; they change within half an hour"

  rain:
    sources: [rain]          # Civil Protection radar (real); rain gauges can be added as a second source
    prior_field: {source: rain_forecast, entity_types: [WeatherForecast], value_key: precipitation, method: idw, min_sd: 3.0}   # Open-Meteo ICON-2I hourly forecast; radar corrects it, then fades back to it
    unit: mm/h
    entity_types: [WeatherObserved]
    value_key: precipitation
    prior:
      mean: 0.2
      sd: 5.0
      basis: "assumption: dry most hours, but rain is heavy-tailed: sd 5 mm/h lets a radar cloudburst through (with sd 1 a 35 mm/h radar reading was pulled down to 7)"
    correlation_length_km: 5.0
    relax_tau_hours: 0.5
    min_value: 0
    calibration: {method: loso, note: "needs rain gauges as held-out stations; radar alone cannot be checked this way"}
    basis: "assumption: rain cells are several km wide and move within half an hour"

  emf:
    sources: [emf_measurements]   # real measurements only (ARPA points); simulated points are refused
    prior_field: {source: emf_baseline, entity_types: [EMFEstimate], value_key: electricField}   # Cartoradio grid, runtime only
    unit: V/m
    entity_types: [ElectromagneticFieldObserved]
    value_key: electricField
    prior:
      mean: 0.6
      sd: 1.0
      basis: "assumption: Cartoradio's central-Rome median is about 0.6 V/m (inspected 13 Nov 2026); used only where the Cartoradio grid (prior_field) has no value"
    correlation_length_km: 0.15
    relax_tau_hours: 168
    min_value: 0
    calibration: {method: none, note: "uncalibrated: the starting map is Cartoradio (a model, with no published uncertainty) and no real EMF measurements are connected yet"}
    basis: "assumption: the field changes within a block of an antenna; it is stable over days"

  activity:
    # Weak proxy (C=40), not a people count: parked shared e-scooters available per cell.
    sources: [micromobility]   # bird_gbfs, real, one reading per available vehicle, ids dropped
    aggregate: count            # count items per cell; empty cells inside the covered area count as 0
    aggregate_window_minutes: 5
    unit: vehicles/cell
    entity_types: [MicromobilityVehicle]
    value_key: availableVehicles
    prior:
      mean: 1
      sd: 3
      basis: "assumption: about 3,700 scooters over a few thousand cells of the service area gives about 1 per cell"
    correlation_length_km: 0    # no spreading: each cell is counted on its own
    relax_tau_hours: 1.0
    min_value: 0
    calibration: {method: none, note: "uncalibrated: scooter counts are a proxy for activity; no ground-truth people counts. Roma Wi-Fi sessions (dati.comune.roma.it, daily, by site) are the next candidate"}
    caveats:
      - "activity here is parked shared e-scooters per cell, a weak proxy (C=40), not a count of people; see wifi_sessions for people"
    basis: "assumption: shared scooters gather where people go; this misses residents and people who do not use them"

  wifi_sessions:
    # Real people activity from the City's DigitRoma Wi-Fi (CC BY 4.0), counted per hotspot site and hour.
    sources: [activity_wifi]   # roma_wifi: CrowdFlowObserved peopleCount, sigma max(1, sqrt(n))
    unit: sessions/hour
    entity_types: [CrowdFlowObserved]
    value_key: peopleCount
    prior:
      mean: 0
      sd: 20
      basis: "assumption: most hotspots see a few sessions an hour; on 12 Nov 2026 the busiest site (Campidoglio) peaked at 56"
    correlation_length_km: 0    # a hotspot says nothing about the next street
    relax_tau_hours: 48         # the files arrive about a day late, so readings must stay meaningful for a day or more
    min_value: 0
    calibration: {method: none, note: "uncalibrated: no ground-truth people counts to check against"}
    caveats:
      - "Wi-Fi sessions are a lower bound on people: only users of the City's free Wi-Fi are counted"
      - "Wi-Fi data runs about one day behind: 'now' shows yesterday's same hour"
      - "only cells with a City hotspot carry data (about 580 sites; 94 had sessions on 12 Nov 2026)"
    basis: "real counts at fixed sites; no spreading to cells without a hotspot"

  transit_supply:
    # Expected public-transport supply: buses and trams the timetable says are in each cell right now.
    sources: [transit_schedule]   # roma_gtfs_schedule: ScheduledVehicle, one item per running trip, interpolated between stops
    aggregate: count
    aggregate_window_minutes: 5
    unit: vehicles/cell
    entity_types: [ScheduledVehicle]
    value_key: scheduledVehicles
    prior:
      mean: 0
      sd: 2
      basis: "assumption: about 1,100 vehicles at 08:30 over thousands of cells, most cells have none"
    correlation_length_km: 0
    relax_tau_hours: 0.5
    min_value: 0
    calibration: {method: none, note: "timetable, not observed: shows planned supply, not what actually runs"}
    caveats:
      - "transit supply is the timetable (planned), not live positions; the live bus feed is used where it works"
    basis: "planned positions from the official GTFS timetable"

  temperature:
    # Air temperature at 2 m: the forecast map interpolated to every cell. No live street stations yet.
    sources: []
    prior_field: {source: weather_forecast, entity_types: [WeatherForecast], value_key: temperature_c, method: idw, min_sd: 1.0}
    unit: degC
    entity_types: [WeatherObserved]
    value_key: temperature
    prior:
      mean: 18
      sd: 8
      basis: "assumption: Rome yearly mean about 16-18 degC; only used where the forecast map is missing"
    correlation_length_km: 3.0
    relax_tau_hours: 3.0
    min_value: -20
    calibration: {method: none, note: "forecast only, no live temperature stations connected"}
    caveats:
      - "temperature is the weather forecast (Open-Meteo), not measured in the street; urban heat islands are not resolved"
    basis: "forecast lattice; min_sd 1 degC because a 2 m forecast is rarely better than that"

heat:
  threshold_c: 32
  basis: "assumption (C=55): around 32 degC the Italian heat-health bulletins start flagging risk for the elderly; real bulletins use perceived temperature"

crowds:
  # Signals shown side by side in the crowds view; a cell is 'busy' when at least min_agree
  # of them are above their own city-wide percentile (among cells where that signal has data).
  signals: [wifi_sessions, activity, transit_supply]
  busy_percentile: 75
  min_agree: 2
  basis: "assumption (C=60): agreement of independent signals is more trustworthy than any single proxy"

flood_watch:
  heavy_rain_mm_h: 10        # operational, not legal: rain at this rate overwhelms street drains in short bursts
  watch_probability: 0.3
  warning_probability: 0.7
  basis: "assumption (C=60): 10 mm/h is a common 'heavy rain' class (e.g. the Italian civil-protection 'forte' band starts around 10-20 mm/h); probabilities chosen to keep warnings rare"

sensor_health:
  # A station is flagged when its median standardised error against its neighbours is above z_flag
  # over at least min_moments moments. Worst first, removed, then re-checked.
  z_flag: 3.0
  min_moments: 3
  basis: "assumption: 3 standard deviations is rare by chance (about 0.3% per reading); the median over several moments ignores one-off spikes"

calibration_rules:
  interval: 0.90            # we check the 90% range
  coverage_ok: [0.80, 0.97] # share of held-out readings inside that range for the layer to count as calibrated
  z_sd_ok: [0.7, 1.4]       # spread of the standardised errors (1.0 = perfectly honest uncertainty)
  min_stations: 5
  basis: "assumption: loose bands because Rome has only about 13 air-quality stations, so the check is noisy"

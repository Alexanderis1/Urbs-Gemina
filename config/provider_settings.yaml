# Settings of each provider (WS3). Which provider is active per layer lives in
# config/providers.yaml; this file only holds how each provider behaves.
# Every assumption carries a "basis" note. Antenna/EMF physics parameters stay in
# config/emf_params.yaml.

simulators:
  # Bump when a simulator's generation logic changes, so old runs stay traceable.
  version: "sim-2026.11.13"

  loops:
    seed: 42
    n_stations: {value: 93, basis: "mirrors the 93 real Roma Mobilita loop stations (design proposal section 8)"}
    # Committed seed built by `python -m twin.providers.simulated.build_seeds loops`:
    # centrally controlled vehicle signals on major roads (Roma Capitale layers).
    # Placeholder positions inside the city bbox are used only if it is missing.
    stations_path: twin/providers/simulated/seed_data/loop_stations.geojson
    snap_to_road_m: {value: 40, basis: "assumption: a signal this close to a major road controls it"}
    min_spacing_m: {value: 600, basis: "assumption: spreads 93 stations over the network instead of clustering downtown"}
    peak_flow_vph:   # per station, both directions
      motorway: {min: 3000, max: 6000}
      trunk: {min: 2000, max: 4000}
      primary: {min: 1000, max: 2500}
      secondary: {min: 600, max: 1500}
      default: {min: 600, max: 2400}
      basis: "assumption: typical lane capacity x lanes by road class"
    free_speed_kmh:
      motorway: 90
      trunk: 70
      primary: 50
      secondary: 50
      default: 50
      basis: "Italian limits (Codice della Strada art. 142); GRA posted limits vary, 90 used as an urban-motorway average"
    noise_flow: {value: 0.08, basis: "assumption"}
    noise_speed: {value: 0.05, basis: "assumption"}

  register:
    # Seed files (git-ignored downloads). Without them every site position is
    # generated, and records carry source_id "sim_register:generated".
    opencellid_csv: data/raw/opencellid/222.csv.gz
    osm_masts_json: data/raw/osm/rome_masts.json
    # Committed seed built by `python -m twin.providers.simulated.build_seeds sites`
    # (OpenCelliD mirror, clustered). Used when the raw CSV above is missing.
    sites_geojson: twin/providers/simulated/seed_data/antenna_sites.geojson
    mcc: 222
    operators:   # MNC -> operator. basis: ITU-T E.212 list for Italy (C=85)
      1: TIM
      10: Vodafone
      50: Iliad
      88: WINDTRE
      99: WINDTRE
    # Site id = cell id shifted right by these bits (eNB for LTE). GSM/UMTS cell
    # ids do not encode the site, so each such cell starts as its own group.
    site_id_shift_bits: {LTE: 8, NR: 14, basis: "LTE: 28-bit ECI = 20-bit eNB + 8-bit cell; NR: assumes 22-bit gNB id (C=50)"}
    merge_distance_m: {value: 150, basis: "heuristic; OpenCelliD centroids lie 100 m-1 km from the mast (C=70)"}
    osm_snap_distance_m: {value: 200, basis: "assumption: an OSM mast this close is taken as the real position"}
    fallback_n_sites: {value: 1500, basis: "assumption: order of magnitude of macro sites per operator mix in Rome (C=40)"}
    fallback_spread_km: {value: 6.0, basis: "assumption: site density falls off like a Gaussian around the centre"}
    building_height_m: {value: 18, basis: "assumption until heights come from the G0 city model"}
    status_shares: {authorised: 0.85, pending: 0.10, under_review: 0.05, basis: "assumption"}
    technology_bands_mhz:   # bands a site of this technology is given
      GSM: ["900"]
      UMTS: ["2100"]
      LTE: ["800", "1800"]
      NR: ["3500"]

  emf_points:
    seed: 42
    n_points: {value: 40, basis: "assumption: comparable to a municipal monitoring campaign"}
    cadence_minutes: 60
    distance_from_site_m: {min: 30, max: 250, basis: "points are placed near installations, like real campaigns"}
    radius_m: {value: 1000, basis: "sites further away contribute negligibly in free space"}
    background_v_m: {value: 0.2, basis: "assumption: diffuse field from distant sources"}
    off_axis_factor: {value: 0.1, basis: "assumption: ground points sit about 20 dB (in power) below the main beam"}
    load_profile: {night: 0.35, peak: 1.0, basis: "assumption: network traffic share by hour"}

  applications:
    seed: 42
    # Synthetic new-installation requests used only to demonstrate the workflow.
    # Positions are approximate public places, to be geocoded by resolve_place.
    items:
      - {id: sim-app-001, address: "Piazza Venezia", lon: 12.4823, lat: 41.8960, operator: TIM, technology: NR, submitted: "2026-10-02"}
      - {id: sim-app-002, address: "Piazza Bologna", lon: 12.5196, lat: 41.9128, operator: Vodafone, technology: LTE, submitted: "2026-10-09"}
      - {id: sim-app-003, address: "Piazza dei Re di Roma", lon: 12.5103, lat: 41.8832, operator: WINDTRE, technology: NR, submitted: "2026-10-17"}
      - {id: sim-app-004, address: "Piazzale Ostiense", lon: 12.4818, lat: 41.8752, operator: Iliad, technology: LTE, submitted: "2026-10-28"}
      - {id: sim-app-005, address: "Largo di Torre Argentina", lon: 12.4767, lat: 41.8955, operator: TIM, technology: LTE, submitted: "2026-11-05"}

open:
  roma_gtfs_rt:
    vehicle_positions_url: https://romamobilita.it/sites/default/files/rome_rtgtfs_vehicle_positions_feed.pb
    trip_updates_url: https://romamobilita.it/sites/default/files/rome_rtgtfs_trip_updates_feed.pb
    speed_sigma_kmh: {value: 3.0, basis: "assumption: GPS-derived speed noise"}
    delay_sigma_s: {value: 60.0, basis: "assumption, used only when the feed gives no 'uncertainty' (Roma's gives about 30 s)"}
    timeout_s: 30

  eea_hourly:
    api_url: https://eeadmz1-downloads-api-appservice.azurewebsites.net/ParquetFile/urls
    metadata_url: https://discomap.eea.europa.eu/map/fme/metadata/PanEuropean_metadata.csv
    country: IT
    city: Roma
    pollutants: [NO2]
    dataset: {value: 1, basis: "1 = unverified up-to-date data (E2a), EEA download service docs"}
    # Hourly "Start" times are station local time; Italy reports in UTC+1.
    utc_offset_hours: {value: 1, basis: "EEA time zone Etc/GMT-1 for Italian stations (C=75)"}
    relative_sigma: {value: 0.15, basis: "data quality objective for continuous NO2 measurement, Directive 2008/50/EC Annex I"}
    pollutant_codes: {NO2: 8, PM10: 5, O3: 7, PM2.5: 6001}
    timeout_s: 60

  dpc_radar:
    api_url: https://radar-api.protezionecivile.it
    origin: https://radar.protezionecivile.it
    product: {value: SRI, basis: "SRI = surface rainfall intensity in mm/h (DPC radar docs)"}
    step_minutes: 5
    max_frames: 12
    relative_sigma: {value: 0.5, basis: "assumption: radar rain-rate error is large (factor of about 2)"}
    timeout_s: 60

restricted:
  cartoradio_grid:
    url: https://d3r7svb6d8d7og.cloudfront.net/tiles/tiles/cartoradio.tiff
    data_date: "2026-09-08"
    credit: "Fonte: Cartoradio - MIMIT/FUB"
    sigma_db: {value: 4.0, basis: "assumption: same spread as the twin's field model (model_error_sigma_db), C=60"}
    cap_v_m: {value: 15.0, basis: "maximum in the inspected tile sits exactly on 15.0; read as '15 or more' (C=55)"}

pa:
  register_file:
    # Path to the administration's register export (GeoJSON, Model A fields).
    # Empty until Roma Capitale provides one.
    path: ""
    licence: "Roma Capitale, internal use"

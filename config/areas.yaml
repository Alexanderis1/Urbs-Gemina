# Spatial units of the twin. Every tool accepts one of these as its "area".
city:
  name: Roma Capitale
  bbox: [12.234, 41.655, 12.856, 42.141]   # approximate
municipi:
  layer: "DIPPC:210_RomaCapitale_Municipi"   # 15 features, Roma Capitale GeoServer
urban_zones:
  layer: "DIPDIT:ZoneUrbanistiche"           # 155 features
census_sections:
  layer: "ISTAT 2021 basi territoriali (R12_21.zip)"
grid:
  system: h3
  city_resolution: 9
heavy_tools_max_area_km2: 40   # micro traffic simulation and ray tracing refuse larger areas

# --- WS4 tool API: how the "area" argument is resolved (added 2026-11-13) ---
# Accepted values: "city", "municipio:<id>" (e.g. municipio:I or municipio:1),
# "zone:<id>" (urban zone code) or a GeoJSON Polygon / MultiPolygon / Feature.
city_area_km2:
  value: 1287.36
  basis: "ISTAT surface of Roma Capitale"
# Field names are tried in order. The first ones were read from the GeoServer on 2026-11-13
# (municipi: municipio, numero_rom; zone urbanistiche: code_zu, denominazione from DIPPC:rc_zone_urbanistiche,
# saved by WS1 as data/processed/urban_zones.geojson); the rest are fallbacks.
municipio_id_fields: [municipio, id_municip, numero_rom, MUNICIPIO, municipio, NUM_MUN, num_mun, COD_MUN, cod_mun, ID, id]
municipio_name_fields: [numero_rom, NOME, nome, DENOMINAZ, denominazione, MUNICIPIO, municipio]
urban_zone_id_fields: [code_zu, ZONA_URBANISTICA, zona_urbanistica, CODZU, codzu, COD_ZU, cod_zu, ZONA_URB, CODICE, codice, ID, id]
urban_zone_name_fields: [DENOMINAZIONE, denominazione, NOME, nome, DEN_ZU, den_zu, DENOMINAZ, denominazione]

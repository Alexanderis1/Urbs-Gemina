# Sports facilities add-on (Challenge 04). Every assumption here has a basis note.
# Read by twin/modules/sports/config.py. Change values here, never in code.

pilot_municipio: "VII"
pilot_basis: >-
  Dense residential municipio (about 300k residents), many school gyms, so the
  "sport desert" story is visible. Proposed in the WS10 thread (C=55); change freely.

matching:
  # Two records are the same facility when names are similar AND close, or when
  # they are very close and of the same kind. Greedy, best pair first.
  name_similarity_min: 0.80
  max_distance_m: 150
  same_kind_distance_m: 25
  # Records without coordinates (e.g. the 2018 CSV) only match on a near-exact
  # name inside the same municipio.
  unlocated_name_similarity_min: 0.92
  basis: >-
    Starting values for Rome, where a facility's point in different sources is
    usually within one block (about 100-150 m). To be checked by hand on the pilot
    municipio and reported as a precision/recall figure.
  # An unnamed OSM pitch or pool this close to a named facility is part of that site
  # (a sports centre mapped as one point plus one feature per pitch).
  part_of_site_distance_m: 120
  part_kinds: [pitch, pool]
  part_basis: >-
    On the real OSM extract (13 Nov 2026) about 5,000 unnamed pitches sit inside named sports
    centres; without this rule each pitch shows up as its own facility.
  # Words removed before comparing names (lowercase, no accents).
  name_stopwords: [centro, sportivo, sportiva, sportive, sportivi, impianto, impianti,
                   comunale, municipale, asd, ssd, a, s, d, srl, polisportiva,
                   associazione, dilettantistica, societa, di, del, della, dei, delle,
                   il, la, lo, le, gli, l, e, ed, via, viale, piazza, roma]

# Which source wins when two merged records disagree (first = most trusted).
source_priority: [manager, roma_sports_municipal, roma_pools, roma_d30_centres, school_gyms, osm, web]
source_priority_basis: >-
  Manager confirmation beats official registry, which beats crowd-sourced OSM,
  which beats unverified web extraction.

reach:
  walk_minutes: 15
  walk_speed_kmh: 4.8
  detour_factor: 1.3
  basis: >-
    Straight-line distance times a detour factor approximates street distance
    (1.2-1.4 is the usual range for European grids). 15 minutes at 4.8 km/h is
    1200 m of street, about 923 m straight line. Labelled "estimated" in outputs.
    Upgrade path: GTFS travel-time catchments from the scenario engine.

transit:
  stop_radius_m: 400
  basis: >-
    400 m is the common planning rule of thumb for walking access to a bus or
    tram stop.

web:
  min_confidence: 0.5
  min_confidence_basis: >-
    Agent-stated confidence below 0.5 is discarded rather than shown. Spot-check a
    sample by hand and report the error rate.
  label_unverified: "from the web, unverified"
  # Accessibility is "not known" unless the quoted source text contains one of these.
  accessibility_keywords: [accessibil, disabil, barriere architettoniche, carrozzin,
                           wheelchair, step-free, senza barriere, ascensore]
  # Only organisational e-mail mailboxes are kept (local part before @).
  org_email_local_parts: [info, segreteria, amministrazione, direzione, contatti,
                          prenotazioni, iscrizioni, ufficio, sport, piscina, palestra,
                          circolo, asd, ssd, municipio, protocollo, pec, staff, eventi]
  # Mobile numbers (Italian prefix 3) are treated as possibly personal and dropped.
  drop_mobile_numbers: true
  # Words that mark a concession holder as an organisation (others are dropped
  # as possibly a private person's name).
  org_name_markers: [asd, ssd, a.s.d, s.s.d, srl, s.r.l, spa, s.p.a, associazione,
                     polisportiva, circolo, club, societa, cooperativa, coop, onlus,
                     federazione, fondazione, ente, consorzio, gruppo, sporting,
                     comune, municipio, roma capitale, team, academy, accademia]

# Canonical discipline ids with the words that map to them (lowercase, no accents).
# OSM sport=* values are matched exactly; other text is matched as a substring.
disciplines:
  football: {it: calcio, words: [calcio, soccer, football, calcetto, calcio a 5, calcio a 8, futsal]}
  tennis: {it: tennis, words: [tennis]}
  padel: {it: padel, words: [padel, paddle]}
  swimming: {it: nuoto, words: [nuoto, piscina, swimming, acquaticit]}
  water_polo: {it: pallanuoto, words: [pallanuoto, water_polo]}
  basketball: {it: pallacanestro, words: [basket, pallacanestro, basketball]}
  volleyball: {it: pallavolo, words: [pallavolo, volley, volleyball, beachvolley, beach_volleyball]}
  athletics: {it: atletica, words: [atletica, athletics, running, pista di atletica]}
  fitness: {it: fitness, words: [fitness, palestra pesi, sala pesi, gym, crossfit, pilates, yoga, potenziamento muscolare]}
  gymnastics: {it: ginnastica, words: [ginnastica, gymnastics, ritmica, artistica, posturale]}
  rugby: {it: rugby, words: [rugby, rugby_union, rugby_league]}
  fencing: {it: scherma, words: [scherma, fencing]}
  martial_arts: {it: arti marziali, words: [judo, karate, taekwondo, aikido, tang su do, arti marziali, martial_arts, boxe, pugilato, boxing, kickboxing, lotta]}
  dance: {it: danza, words: [danza, ballo, balli, dance, tango]}
  skating: {it: pattinaggio, words: [pattinaggio, skating, roller_skating, ice_skating, hockey]}
  cycling: {it: ciclismo, words: [ciclismo, cycling, bmx]}
  bocce: {it: bocce, words: [bocce, boules, bocciofila]}
  rowing: {it: canottaggio, words: [canottaggio, canoa, rowing, canoe, kayak]}
  equestrian: {it: equitazione, words: [equitazione, equestr, maneggi, ippodromo, ippic]}
  golf: {it: golf, words: [golf]}
  table_tennis: {it: tennistavolo, words: [tennistavolo, ping pong, table_tennis]}
  floorball: {it: floorball, words: [floorball, flooball, unihockey]}
  climbing: {it: arrampicata, words: [arrampicata, climbing, boulder]}
  multisport: {it: polivalente, words: [polivalente, multi, multisport, polisportiv]}

deserts:
  # A zone is a "sport desert" for a discipline when at least this share of its
  # residents has no facility for it within reach, and it has enough residents to matter.
  min_uncovered_share: 0.5
  min_residents: 1000
  basis: >-
    Planning choice, not a standard: "most residents lack access" and a floor so
    nearly empty zones (parks, industrial areas) are not flagged. Tune with the office.

coverage:
  # OSM swimming pools with no name and no access tag are left out of coverage counts.
  exclude_osm_unnamed_pools_without_access: true
  basis: >-
    On the real OSM extract 7,598 unnamed pools are tagged access=private (garden and
    condominium pools) and 1,842 more are unnamed with no access tag; they are very likely the
    same kind (C=85). They stay on the map; they just do not count as "a pool you can use".
    Facilities a source tags access=private or access=no never count.

# Disciplines assumed for a school gym opened to the community in the what-if,
# when the user does not say which ones.
school_gym_default_disciplines: [volleyball, basketball, gymnastics]
school_gym_basis: >-
  A standard Italian school gym is sized for volleyball and basketball courts and
  gymnastics (CONI/MIUR school-sports building guidance). Assumed (what-if): a scenario input, not a sensor.

# Field names looked up (case-insensitive, exact first, then "contains") in each
# official source. The real names of DIPPC:243_ServiziSportivi were not visible
# from the build sandbox, so these are guesses to check on the first real download.
source_fields:
  basis: >-
    Checked on the real layers on 2026-11-13: DIPPC:243 uses nome, tipologia, indirizzo, mun,
    attivo, scadenza_, concessio, lat, lon (tel1-3 and email1 are dropped as possibly personal);
    GABSIN:piscine uses nome, indirizzo, municipio, giorni_ap7, orario_70, sito_web.
  common:
    id: [fid, id, objectid, gid, codice]
    name: [denominazione, nome, name, denominaz, impianto]
    kind: [tipologia, tipo, categoria, attivita, disciplina]
    address: [indirizzo, address, via, ubicazione]
    municipio: [municipio, mun]
    active: [attivo, stato, attiva]
    concession_expiry: [scadenza, scad]
    manager: [concessio, concessionario, gestore, affidatario]
    hours: [orario, orari]
    opening_period: [periodo, apertura, giorni]
    website: [sito_web, website, sito]
    lon: [lon, longitudine, x]
    lat: [lat, latitudine, y]

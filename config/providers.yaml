# One active provider per layer. To go live with the administration's own data,
# change the value on the right (e.g. sim_loops -> pa_datex) and add credentials
# or file paths in config/provider_settings.yaml. No code changes (Gate C).
# Every provider id is listed in twin/providers/registry.py.
# Rule (13 Nov 2026): only the road loops are simulated; every other layer uses
# real sensors, or estimates fused from real sources.

traffic_flow: sim_loops            # SIMULATED. later: pa_datex (Roma Mobilita loop stations, DATEX II)
antenna_register: est_register     # estimated: OpenCelliD + OSM + Cartoradio fit. later: pa_register_file
emf_measurements: arpa_points      # real ARPA Lazio measurements (not available until the table is loaded)
emf_baseline: cartoradio_grid      # estimated, restricted: runtime read only, never stored in the repo
transit: roma_gtfs_rt              # real, open (CC BY-SA)
air_quality: eea_hourly            # real, open: official stations
air_quality_citizen: sensor_community  # real, open: citizen PM sensors (noisier, larger sigma)
air_quality_model: cams_open_meteo # estimated: CAMS model background for the belief layer
rain: dpc_radar                    # real, open
micromobility: bird_gbfs           # real, open: available shared e-scooters
context_layers: roma_wfs           # real, open (see scripts/fetch_static_layers.py)

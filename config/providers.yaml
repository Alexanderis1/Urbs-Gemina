# One active provider per layer. To go live with the administration's own data,
# change the value on the right (e.g. sim_loops -> pa_datex) and add credentials.
# Providers marked "planned" are not implemented yet and are skipped at startup.

traffic_flow: sim_loops            # later: pa_datex   (Roma Mobilita loop stations, DATEX II)
antenna_register: sim_register     # planned. later: pa_register (Model A applications)
emf_measurements: sim_emf_points   # planned. later: arpa_points
emf_baseline: cartoradio_grid      # planned. restricted: runtime read only, never stored in the repo
transit: roma_gtfs_rt              # planned. real, open (CC BY-SA)
air_quality: eea_hourly            # planned. real, open
rain: dpc_radar                    # planned. real, open
context_layers: roma_wfs           # real, open (see scripts/fetch_static_layers.py)

# Use-case playbooks (agents/use_cases.py). Each one is a fixed plan of tool calls that code runs in
# order, so the facts never depend on the model. The model only writes the narrative from those runs,
# and the verifier checks every figure. Nothing here is a legal threshold: those live in
# config/thresholds.yaml only.
#
# Inputs a playbook can take:
#   area   "city", "municipio:<1-15>", "zone:<CODE>" or a GeoJSON polygon
#   place  free text (address or place name), resolved by the resolve_place step
#   params use-case options, with defaults below (e.g. event attendees)
#
# Templates in step args (a value that is exactly "{ref}" keeps its type; refs inside text are written as text):
#   {area} {area_label} {params.<name>}    "{?ref}" = optional: the key is left out when the ref is empty
#   {<step id>.point}       [lon, lat] from a resolve_place step
#   {<step id>.municipio}   "municipio:<n>" of that place
#   {<step id>.circle}      polygon of radius params.radius_m around that place
#   {<step id>.<name>}      polygon of radius params.<name>_radius_m, e.g. {place.district}, {place.traffic}
#                           (heavy runs on a road network; a test keeps each under its kind's area cap)
# Static feature layers carry limit: 30 (the count stays the full total; config/agents.yaml model_view trims the rest).
# group_by: <property> adds counts over every feature in the area (e.g. how many interface areas are R4), not only the listed 30.
# A step whose refs cannot be filled (e.g. the place was not found) is skipped, and the reason is
# handed to the model and to the officer. A step that fails or is not available is reported, not hidden.

# Forecast layers (rain_forecast, weather_forecast) are queried on the whole city: their grid is coarse, so a
# municipio often holds no grid point (dry run 14 Nov 2026: 0 points in municipi I and V, 30 for the city).
defaults:
  # Area used when a playbook needs one and the caller gave none (whole-city default, CLAUDE.md).
  area: city
  basis: "CLAUDE.md: whole city by default; heavy simulations take an operating area."
  # {when.<name>} in step args = the next time this local clock time comes round, in UTC.
  moments:
    timezone: Europe/Rome
    tonight: "03:00"
    afternoon: "15:00"
    basis: "Night minimum is usually reached just before dawn, the day maximum mid-afternoon (Rome Urbe climate); a forecast layer answers for one time only (live check 14 Nov: the cold note had no night minimum)."

use_cases:

  municipio_briefing:
    title: {it: "Briefing mattutino del municipio", en: "Morning municipio briefing"}
    summary: {it: "Trasporti, traffico, aria, pioggia, fiume, notizie e stato dei dati per un municipio.",
              en: "Transit, traffic, air, rain, river, news and data status for one municipio."}
    tiers: [office]
    needs: [area]
    prompt: briefing
    steps:
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{area}"}, label: "public transport delays"}
      - {id: schedule, tool: query_layer, args: {layer: transit_schedule, area: "{area}", limit: 30}, label: "buses and trams running by the timetable now (estimated; the fallback when the live feed is stale)"}
      - {id: traffic, tool: query_layer, args: {layer: traffic_flow, area: "{area}"}, label: "road traffic (simulated loops)"}
      - {id: air, tool: query_layer, args: {layer: air_quality, area: "{area}"}, label: "air quality stations"}
      - {id: rain, tool: query_layer, args: {layer: rain_forecast, area: city}, label: "rain forecast, next hours (coarse grid over all of Rome)"}
      - {id: weather, tool: query_layer, args: {layer: weather_forecast, area: city, time: "{when.afternoon}"}, label: "temperature and wind forecast for the next afternoon around 15:00 (coarse grid over all of Rome)"}
      - {id: river, tool: query_layer, args: {layer: river_discharge, area: city}, label: "Tiber and Aniene discharge forecast"}
      - {id: news, tool: news_search, args: {query: "disservizi chiusure scioperi {area_label} Roma oggi"}, label: "disruption news (unverified)"}
      - {id: data, tool: data_status, args: {}, label: "which layers are real, estimated or simulated"}
    basis: "Design proposal section 2 ('Brief me on my municipio this morning'). One tool pass and one model call, instead of one agent loop per topic."

  civil_protection_alert:
    title: {it: "Assistente allerta protezione civile", en: "Civil-protection alert assistant"}
    summary: {it: "Pioggia e piena previste, dove si accumula l'acqua, sottopassi, siti sensibili e accesso dei soccorsi.",
              en: "Forecast rain and river levels, where water collects, underpasses, sensitive sites and emergency access."}
    tiers: [office]
    needs: [area]
    prompt: civil_protection
    params:
      duration_h: {default: 3, basis: "Typical duration of a convective storm cell over Rome; the rain_flood forecast window."}
    steps:
      - {id: rain, tool: query_layer, args: {layer: rain_forecast, area: city}, label: "rain forecast (coarse grid over all of Rome)"}
      - {id: river, tool: query_layer, args: {layer: river_discharge, area: city}, label: "river discharge forecast"}
      - {id: rain_flood, tool: run_scenario, args: {kind: rain_flood, area: "{area}", change: {source: forecast, duration_h: "{params.duration_h}"}},
         label: "where rain water collects (forecast rain, sewers, outfalls)"}
      - {id: river_flood, tool: run_scenario, args: {kind: river_flood, area: "{area}", change: {gauge: tevere_ripetta, forecast_day: peak}},
         label: "Tiber at its forecast peak"}
      - {id: underpasses, tool: query_layer, args: {layer: road_underpasses_osm, area: "{area}", limit: 30}, label: "road underpasses"}
      - {id: pgra, tool: query_layer, args: {layer: flood_hazard_pgra, area: "{area}", limit: 30}, label: "official flood hazard areas (PGRA)"}
      - {id: landslides, tool: query_layer, args: {layer: landslide_areas, area: "{area}", limit: 30}, label: "official landslide areas"}
      - {id: muster, tool: query_layer, args: {layer: civil_protection_areas, area: "{area}", limit: 30, group_by: class_are}, label: "emergency plan areas (A waiting, B reception, C shelters, D staging)"}
      - {id: access, tool: run_scenario, args: {kind: emergency_access, area: "{area}", change: {service: ambulance, flood: {kind: rain_flood, change: {source: forecast, duration_h: "{params.duration_h}"}}}},
         label: "ambulance reach with flooded roads closed"}
      - {id: alerts, tool: news_search, args: {query: "allerta meteo protezione civile Roma {area_label}"}, label: "official alerts and news (unverified)"}
    basis: "Coordinator brief (14 Nov): civil-protection alert assistant. Uses only the WS6 flood engines on real forecasts; the official alert colour comes from the Region, not from us."

  heat_plan_elderly:
    title: {it: "Piano caldo per gli anziani", en: "Heat plan for the elderly"}
    summary: {it: "Dove fa più caldo di giorno e di notte, quanti over 65 vivono lì, RSA e ospedali vicini, effetto di nuovi alberi.",
              en: "Hottest streets by day and night, residents over 65 there, care homes and hospitals nearby, effect of new trees."}
    tiers: [office]
    needs: [area]
    prompt: heat_plan
    params:
      tmax_c: {default: null, basis: "Optional what-if: a day maximum the officer names (e.g. 38). Without it the forecast is used."}
      tmin_c: {default: null, basis: "Optional what-if night minimum, used with tmax_c."}
      cover_added_pct: {default: 10, basis: "Same default as the heatwave engine (percentage points of tree cover added); what-if only."}
    steps:
      - {id: weather, tool: query_layer, args: {layer: weather_forecast, area: city, time: "{when.afternoon}"}, label: "temperature forecast for the next afternoon around 15:00 (coarse grid over all of Rome)"}
      - {id: heat, tool: run_scenario, args: {kind: heatwave, area: "{area}", change: {temperature: forecast, tmax_c: "{?params.tmax_c}", tmin_c: "{?params.tmin_c}"}},
         label: "heat by street, residents over 65 above thresholds (forecast, or the officer's what-if temperatures)"}
      - {id: trees, tool: run_scenario, args: {kind: heatwave, area: "{area}", change: {temperature: forecast, tmax_c: "{?params.tmax_c}", tmin_c: "{?params.tmin_c}", plant_trees: {cover_added_pct: "{params.cover_added_pct}"}}},
         label: "what-if: more tree cover across the area"}
      - {id: care_homes, tool: query_layer, args: {layer: care_homes_osm, area: "{area}", limit: 30}, label: "care homes (RSA)"}
      - {id: hospitals, tool: query_layer, args: {layer: emergency_hospitals, area: "{area}", limit: 30}, label: "emergency hospitals"}
      - {id: pharmacies, tool: query_layer, args: {layer: pharmacies_roma, area: "{area}", limit: 30}, label: "pharmacies"}
      - {id: parks, tool: query_layer, args: {layer: parks_municipal, area: "{area}", limit: 30}, label: "municipal parks (shade)"}
      - {id: refuges, tool: query_layer, args: {layer: climate_refuges_indoor, area: "{area}", limit: 30}, label: "indoor cool places of the Roma climate-refuge map (aria_cond = air conditioning)"}
      - {id: fountains, tool: query_layer, args: {layer: drinking_fountains, area: "{area}", limit: 30}, label: "public drinking fountains (nasoni)"}
      - {id: law, tool: legal_lookup, args: {question: "piano ondate di calore anziani Roma Capitale Ministero della Salute bollettino"}, label: "official heat plan"}
    basis: "Coordinator brief (14 Nov): heat plan for the elderly. Heat model, census 65+ and tree cover are WS6 (real Copernicus and ISTAT layers)."

  site_risk_check:
    title: {it: "Verifica rischi di una scuola o di un ospedale", en: "School or hospital risk check"}
    summary: {it: "Per un indirizzo: siti sensibili vicini, aree a rischio alluvione, zone Seveso, vincoli e tempi dei soccorsi.",
              en: "For one address: nearby sensitive sites, flood hazard, Seveso zones, constraints and emergency reach."}
    tiers: [office]
    needs: [place]
    prompt: site_risk
    params:
      radius_m: {default: 500, basis: "Walking-distance ring around a school or hospital for hazards; not a legal distance."}
      district_radius_m: {default: 1500, basis: "Road-network district for emergency reach: about 7 km2. 2,500 m (20 km2) made the live event playbook run past 15 minutes on the Modal worker (deploy thread, 14 Nov); stations outside the district are reached with the off-network detour."}
      duration_h: {default: 3, basis: "Same storm window as the civil-protection playbook."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "where the site is"}
      - {id: context, tool: context_check, args: {point: "{place.point}", radius_m: "{params.radius_m}"}, label: "sensitive sites and constraints around it"}
      - {id: pgra, tool: query_layer, args: {layer: flood_hazard_pgra, area: "{place.circle}", limit: 30}, label: "official flood hazard areas (PGRA) within the ring"}
      - {id: seveso, tool: query_layer, args: {layer: seveso_damage_zones, area: "{place.circle}", limit: 30}, label: "Seveso plant damage zones within the ring"}
      - {id: underpasses, tool: query_layer, args: {layer: road_underpasses_osm, area: "{place.circle}", limit: 30}, label: "road underpasses within the ring"}
      - {id: landslides, tool: query_layer, args: {layer: landslide_areas, area: "{place.circle}", limit: 30}, label: "official landslide areas within the ring"}
      - {id: cavities, tool: query_layer, args: {layer: underground_cavities, area: "{place.circle}", limit: 30}, label: "known underground cavities within the ring (sinkhole context)"}
      - {id: past, tool: query_layer, args: {layer: civil_protection_events, area: "{place.circle}", limit: 30, group_by: sottotipol}, label: "past civil-protection interventions within the ring, 2013-2022 (floods, trees down, fires, sinkholes)"}
      - {id: muster, tool: query_layer, args: {layer: civil_protection_areas, area: "{place.circle}", limit: 30, group_by: class_are}, label: "emergency plan areas within the ring (waiting, reception, staging)"}
      - {id: air, tool: query_layer, args: {layer: air_quality, area: "{place.municipio}"}, label: "air quality in its municipio"}
      - {id: access, tool: run_scenario, args: {kind: emergency_access, area: "{place.district}", change: {service: ambulance, flood: {kind: rain_flood, change: {source: forecast, duration_h: "{params.duration_h}"}}}},
         label: "ambulance reach in the district around it, with roads flooded by the forecast rain closed"}
    basis: "Coordinator brief (14 Nov): school and hospital risk checks. Hazards come from official layers (PGRA, Seveso), not from the model."

  event_planning:
    title: {it: "Pianificazione di un grande evento", en: "Big event planning"}
    summary: {it: "Folla attesa, traffico, trasporti, ospedali vicini e accesso dei soccorsi con l'area chiusa.",
              en: "Expected crowd, traffic, transit, hospitals nearby and emergency access with the area closed."}
    tiers: [office]
    needs: [place]
    prompt: event_planning
    params:
      attendees: {default: 20000, basis: "Placeholder crowd size when the officer gives none; the officer should state the real figure."}
      radius_m: {default: 400, basis: "Typical closed perimeter around a large square event in Rome."}
      district_radius_m: {default: 1500, basis: "Road-network district for emergency reach: about 7 km2. 2,500 m (20 km2) made the live event playbook run past 15 minutes on the Modal worker (deploy thread, 14 Nov); stations outside the district are reached with the off-network detour."}
      traffic_radius_m: {default: 650, basis: "SUMO district of about 1.3 km2: the size measured at 93 s cold and 44 s cached on the Modal worker (config/scenarios.yaml road_closure.max_area_km2 basis); 900 m (2.5 km2) plus the access run did not finish in 15 minutes live."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "where the event is"}
      - {id: context, tool: context_check, args: {point: "{place.point}", radius_m: "{params.radius_m}"}, label: "sensitive sites inside the perimeter"}
      - {id: crowd, tool: query_layer, args: {layer: activity_wifi, area: "{place.circle}"}, label: "usual crowd now (public Wi-Fi sessions)"}
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{place.municipio}"}, label: "public transport delays"}
      - {id: traffic, tool: run_scenario, args: {kind: traffic_event, area: "{place.traffic}", change: {event: {lon: "{place.lon}", lat: "{place.lat}", attendees: "{params.attendees}", radius_m: "{params.radius_m}"}}},
         label: "traffic with the event (SUMO, synthetic demand)"}
      - {id: access, tool: run_scenario, args: {kind: emergency_access, area: "{place.district}", change: {service: ambulance, closed_area: "{place.circle}"}},
         label: "ambulance reach with the perimeter closed"}
      - {id: hospitals, tool: query_layer, args: {layer: emergency_hospitals, area: "{place.municipio}", limit: 30}, label: "emergency hospitals"}
    basis: "Coordinator brief (14 Nov): event planning (traffic plus crowd plus emergency access)."

  antenna_permit:
    title: {it: "Contesto per una nuova antenna (Sfida 02)", en: "New antenna permit context (Challenge 02)"}
    summary: {it: "Siti sensibili entro il raggio, stima del campo con incertezza, quadro normativo. Non decide.",
              en: "Sensitive sites within the radius, field estimate with uncertainty, legal frame. It does not decide."}
    tiers: [office]
    needs: [place]
    prompt: permit_playbook
    params:
      radius_m: {default: 300, basis: "Same value as config/thresholds.yaml context radius (Challenge 02 brief); kept equal by a test."}
      band: {default: "3500", basis: "Most new applications in Rome are 5G n78 (3.5 GHz); EIRP per band comes from config/emf_params.yaml."}
      height_m: {default: 25, basis: "Typical rooftop mast height in Rome; the officer should give the real one from the application."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "where the antenna would be"}
      - {id: context, tool: context_check, args: {point: "{place.point}", radius_m: "{params.radius_m}"}, label: "sensitive sites and constraints"}
      - {id: field, tool: estimate_field, args: {area: "{place.circle}"}, label: "field estimate today (P5-P95)"}
      - {id: exposure, tool: run_scenario, args: {kind: population_exposure, area: "{place.municipio}", change: {action: add, site: {lon: "{place.lon}", lat: "{place.lat}", height_m: "{params.height_m}", band: "{params.band}"}}},
         label: "residents above thresholds, before and after"}
      - {id: law, tool: legal_lookup, args: {question: "valore di attenzione campi elettromagnetici legge 214/2023 articolo 10"}, label: "attention value"}
    basis: "Challenge 02. Same facts as the permit flow (agents/permit.py), reachable from chat and voice."

  sport_deserts:
    title: {it: "Deserti sportivi (Sfida 04)", en: "Sport deserts (Challenge 04)"}
    summary: {it: "Residenti senza un impianto per una disciplina a distanza di cammino, e impianti esistenti.",
              en: "Residents without a facility for a discipline within walking time, and existing facilities."}
    tiers: [office, citizen]
    needs: [area]
    prompt: sport_deserts
    params:
      discipline: {default: football, basis: "Most common discipline in the municipal register; ids are the English keys of config/sports.yaml disciplines, and the API also accepts the Italian names (calcio, nuoto)."}
    steps:
      - {id: facilities, tool: sports_facilities, args: {area: "{area}", discipline: "{params.discipline}"}, label: "facilities for the discipline"}
      - {id: coverage, tool: sport_coverage, args: {area: "{area}", discipline: "{params.discipline}"}, label: "residents within walking time"}
    basis: "Challenge 04 add-on (WS10)."

  citizen_area_info:
    title: {it: "Informazioni per i cittadini sulla propria zona", en: "Citizen information about their area"}
    summary: {it: "Aria, pioggia, trasporti e servizi sanitari vicini a un indirizzo, in parole semplici.",
              en: "Air, rain, transit and health services near an address, in plain words."}
    tiers: [office, citizen]
    needs: [place]
    prompt: citizen_info
    params:
      radius_m: {default: 800, basis: "About a 10-minute walk."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "the address"}
      - {id: air, tool: query_layer, args: {layer: air_quality, area: "{place.municipio}"}, label: "air quality"}
      - {id: rain, tool: query_layer, args: {layer: rain_forecast, area: city}, label: "rain forecast (coarse grid over all of Rome)"}
      - {id: weather, tool: query_layer, args: {layer: weather_forecast, area: city}, label: "temperature forecast (coarse grid over all of Rome)"}
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{place.circle}"}, label: "public transport nearby"}
      - {id: schedule, tool: query_layer, args: {layer: transit_schedule, area: "{place.circle}", limit: 30}, label: "lines running nearby by the timetable (estimated; used when the live feed is stale)"}
      - {id: pharmacies, tool: query_layer, args: {layer: pharmacies_roma, area: "{place.circle}", limit: 30}, label: "pharmacies nearby"}
      - {id: health, tool: query_layer, args: {layer: emergency_hospitals, area: "{place.municipio}", limit: 30}, label: "emergency hospitals"}
    basis: "Coordinator brief (14 Nov): citizen Q&A. Aggregated, public layers only; the API applies the citizen tier itself."

  industrial_accident:
    title: {it: "Incidente in uno stabilimento a rischio (Seveso)", en: "Accident at a high-risk (Seveso) plant"}
    summary: {it: "Nube tossica con il vento previsto: zone sopra le soglie sanitarie, residenti e siti sensibili, zone ufficiali del piano, ospedali.",
              en: "Toxic cloud with the forecast wind: areas above health thresholds, residents and sensitive sites, official plan zones, hospitals."}
    tiers: [office]
    needs: [place]
    prompt: industrial_accident
    params:
      substance: {default: ammonia, basis: "Substances with AEGL/IDLH values in config/scenarios.yaml (ammonia, chlorine, hydrogen_sulfide); ammonia is the most common refrigerant and fertiliser gas."}
      release_kg_s: {default: null, basis: "Optional; without it the engine uses its own default release rate (config/scenarios.yaml)."}
    steps:
      - {id: wind, tool: query_layer, args: {layer: weather_forecast, area: city}, label: "wind and temperature forecast (coarse grid over all of Rome)"}
      - {id: plume, tool: run_scenario, args: {kind: chemical_plume, area: "{area}", change: {site: "{place}", substance: "{params.substance}", release_kg_s: "{?params.release_kg_s}", wind: forecast}},
         label: "toxic cloud with the forecast wind (Gaussian plume ensemble)"}
      - {id: zones, tool: query_layer, args: {layer: seveso_damage_zones, area: "{area}", limit: 30}, label: "official damage zones of the external emergency plans"}
      - {id: hospitals, tool: query_layer, args: {layer: emergency_hospitals, area: "{area}", limit: 30}, label: "emergency hospitals"}
      - {id: muster, tool: query_layer, args: {layer: civil_protection_areas, area: "{area}", limit: 30, group_by: class_are}, label: "emergency plan areas (waiting, reception, shelters)"}
      - {id: news, tool: news_search, args: {query: "incidente stabilimento {place} Roma"}, label: "news about the plant (unverified)"}
      - {id: law, tool: legal_lookup, args: {question: "piano di emergenza esterna stabilimenti a rischio incidente rilevante D.Lgs. 105/2015 Prefettura di Roma"}, label: "external emergency plan rules"}
    basis: "Quality round (14 Nov): the chemical_plume engine (WS6) and the Seveso layers had no use case. The place is the plant name as in seveso_perimeters (e.g. 'Energas')."

  air_quality_episode:
    title: {it: "Episodio di inquinamento dell'aria", en: "Air pollution episode"}
    summary: {it: "Stazioni ufficiali, sensori dei cittadini e modello CAMS, vento previsto, scuole e nidi dell'area, norme sui limiti.",
              en: "Official stations, citizen sensors and the CAMS model, forecast wind, schools and nurseries in the area, legal limits."}
    tiers: [office]
    needs: [area]
    prompt: air_episode
    steps:
      - {id: stations, tool: query_layer, args: {layer: air_quality, area: "{area}"}, label: "official stations (EEA, ARPA Lazio)"}
      - {id: citizens, tool: query_layer, args: {layer: air_quality_citizen, area: "{area}"}, label: "citizen PM sensors (noisier)"}
      - {id: model, tool: query_layer, args: {layer: air_quality_model, area: city}, label: "CAMS model background (coarse grid over all of Rome)"}
      - {id: wind, tool: query_layer, args: {layer: weather_forecast, area: city}, label: "wind forecast (coarse grid over all of Rome)"}
      - {id: schools, tool: query_layer, args: {layer: schools_state, area: "{area}", limit: 30}, label: "state schools"}
      - {id: nurseries, tool: query_layer, args: {layer: nidi, area: "{area}", limit: 30}, label: "municipal nurseries"}
      - {id: law, tool: legal_lookup, args: {question: "valori limite PM10 NO2 D.Lgs. 155/2010 superamenti giornalieri"}, label: "legal limits"}
      - {id: news, tool: news_search, args: {query: "smog blocco traffico Roma {area_label}"}, label: "traffic bans and notices (unverified)"}
    basis: "Quality round (14 Nov): three air sources already fused in the providers had no use case."

  strike_day_mobility:
    title: {it: "Giornata di sciopero dei trasporti", en: "Public transport strike day"}
    summary: {it: "Ritardi dei mezzi, velocità stradali, monopattini disponibili, affollamento e notizie sullo sciopero.",
              en: "Transit delays, road speeds, shared e-scooters available, crowding and news about the strike."}
    tiers: [office]
    needs: [area]
    prompt: strike_day
    steps:
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{area}"}, label: "public transport delays (GTFS-RT)"}
      - {id: schedule, tool: query_layer, args: {layer: transit_schedule, area: "{area}", limit: 30}, label: "buses and trams running by the timetable now (estimated; the fallback when the live feed is stale)"}
      - {id: transit_belief, tool: query_layer, args: {layer: transit_delay, area: "{area}"}, label: "transit delay map with uncertainty"}
      - {id: roads, tool: query_layer, args: {layer: road_speed, area: "{area}"}, label: "road speed map (simulated loops fused)"}
      - {id: scooters, tool: query_layer, args: {layer: micromobility, area: "{area}"}, label: "shared e-scooters available"}
      - {id: crowd, tool: query_layer, args: {layer: wifi_sessions, area: "{area}"}, label: "public Wi-Fi activity (crowd proxy)"}
      - {id: park_ride, tool: query_layer, args: {layer: park_and_ride, area: "{area}", limit: 30}, label: "park-and-ride car parks (places, metro line)"}
      - {id: news, tool: news_search, args: {query: "sciopero trasporti Roma ATAC fasce di garanzia"}, label: "strike notices (unverified)"}
    basis: "Quality round (14 Nov): strikes are in the data steward's monitors; this joins them with the live mobility layers."

  roadworks_check:
    title: {it: "Verifica di un cantiere stradale", en: "Roadworks check"}
    summary: {it: "Per un cantiere: vincoli e siti sensibili vicini, cavità e interventi passati, traffico con la strada chiusa, soccorsi, trasporti, norme.",
              en: "For a worksite: constraints and sensitive sites nearby, cavities and past interventions, traffic with the street closed, emergency reach, transit, rules."}
    tiers: [office]
    needs: [place]
    prompt: roadworks
    params:
      street: {default: null, type: text, basis: "Optional: the street the works close, exactly as named on the road network (e.g. 'Via Nazionale'). Without it the traffic run is skipped."}
      radius_m: {default: 200, basis: "A block around the worksite: heritage, sensitive sites and ground hazards; not a legal distance."}
      worksite_radius_m: {default: 40, basis: "A typical urban worksite fence closing one junction or one block; the officer's plan gives the real footprint."}
      district_radius_m: {default: 1500, basis: "Road-network district for emergency reach: about 7 km2. 2,500 m (20 km2) made the live event playbook run past 15 minutes on the Modal worker (deploy thread, 14 Nov); stations outside the district are reached with the off-network detour."}
      traffic_radius_m: {default: 650, basis: "SUMO district of about 1.3 km2: the size measured at 93 s cold and 44 s cached on the Modal worker (config/scenarios.yaml road_closure.max_area_km2 basis); 900 m (2.5 km2) plus the access run did not finish in 15 minutes live."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "where the works are"}
      - {id: context, tool: context_check, args: {point: "{place.point}", radius_m: "{params.radius_m}"}, label: "heritage and landscape constraints, sensitive sites around the worksite"}
      - {id: cavities, tool: query_layer, args: {layer: underground_cavities, area: "{place.circle}", limit: 30}, label: "known underground cavities (sinkhole context)"}
      - {id: past, tool: query_layer, args: {layer: civil_protection_events, area: "{place.circle}", limit: 30, group_by: sottotipol}, label: "past civil-protection interventions nearby, 2013-2022 (sinkholes, flooding, trees down)"}
      - {id: traffic, tool: run_scenario, args: {kind: traffic_event, area: "{place.traffic}", change: {close: {street: "{params.street}"}}},
         label: "traffic with the street closed (SUMO, synthetic demand)"}
      - {id: access, tool: run_scenario, args: {kind: emergency_access, area: "{place.district}", change: {service: ambulance, closed_area: "{place.worksite}"}},
         label: "ambulance reach with the worksite fenced off"}
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{place.circle}"}, label: "public transport passing the worksite"}
      - {id: news, tool: news_search, args: {query: "lavori cantiere {place} Roma chiusura strada"}, label: "works already announced there (unverified)"}
      - {id: law, tool: legal_lookup, args: {question: "Codice della strada articolo 21 opere depositi e cantieri stradali segnalamento"}, label: "rules for worksites on roads"}
    basis: "Round 3 (14 Nov): Rome runs thousands of worksites (Jubilee, Metro C, PNRR); the traffic and emergency-access engines, the heritage layers and the new cavity and past-event layers had no joint use case."

  cold_weather_plan:
    title: {it: "Piano freddo", en: "Cold-weather plan"}
    summary: {it: "Minime previste, punti di accoglienza del Piano Freddo, luoghi pubblici al chiuso, ospedali e avvisi.",
              en: "Forecast minimum temperatures, Piano Freddo reception points, indoor public places, hospitals and notices."}
    tiers: [office]
    needs: [area]
    prompt: cold_plan
    steps:
      - {id: weather, tool: query_layer, args: {layer: weather_forecast, area: city, time: "{when.tonight}"}, label: "temperature and wind forecast for tonight around 03:00 (coarse grid over all of Rome)"}
      - {id: shelters, tool: query_layer, args: {layer: cold_plan_shelters, area: "{area}", limit: 30, group_by: tipologia}, label: "Piano Freddo reception points (sites)"}
      - {id: indoor, tool: query_layer, args: {layer: climate_refuges_indoor, area: "{area}", limit: 30}, label: "indoor public places (libraries, civic centres)"}
      - {id: hospitals, tool: query_layer, args: {layer: emergency_hospitals, area: "{area}", limit: 30}, label: "emergency hospitals"}
      - {id: muster, tool: query_layer, args: {layer: civil_protection_areas, area: "{area}", limit: 30, group_by: class_are}, label: "civil-protection reception structures and areas"}
      - {id: news, tool: news_search, args: {query: "piano freddo Roma Capitale accoglienza senza dimora {area_label}"}, label: "Piano Freddo notices (unverified)"}
      - {id: alerts, tool: news_search, args: {query: "allerta gelo neve ghiaccio Roma protezione civile"}, label: "frost and ice alerts (unverified)"}
    basis: "Round 3 (14 Nov): the Piano Freddo runs from November; its official reception points are on the Roma civil-protection GeoServer."

  wildfire_risk:
    title: {it: "Rischio incendi di interfaccia", en: "Wildfire risk at the urban edge"}
    summary: {it: "Aree di interfaccia a rischio R3-R4, vento e caldo previsti, aree protette e parchi, aree di attesa, avvisi.",
              en: "Urban-edge areas at fire risk R3-R4, forecast wind and heat, protected areas and parks, waiting areas, notices."}
    tiers: [office]
    needs: [area]
    prompt: wildfire
    steps:
      - {id: weather, tool: query_layer, args: {layer: weather_forecast, area: city, time: "{when.afternoon}"}, label: "temperature and wind forecast for the next afternoon around 15:00 (coarse grid over all of Rome)"}
      - {id: interface, tool: query_layer, args: {layer: wildfire_interface, area: "{area}", limit: 30, group_by: rischio}, label: "official interface areas at fire risk R3-R4"}
      - {id: protected, tool: query_layer, args: {layer: protected_areas, area: "{area}", limit: 30}, label: "protected natural areas"}
      - {id: parks, tool: query_layer, args: {layer: parks_municipal, area: "{area}", limit: 30}, label: "municipal parks"}
      - {id: muster, tool: query_layer, args: {layer: civil_protection_areas, area: "{area}", limit: 30, group_by: class_are}, label: "emergency plan waiting and reception areas"}
      - {id: news, tool: news_search, args: {query: "incendio Roma {area_label} vigili del fuoco"}, label: "recent fires (unverified)"}
      - {id: law, tool: legal_lookup, args: {question: "periodo di massima pericolosità incendi boschivi Regione Lazio divieti"}, label: "high-risk season rules"}
    basis: "Round 3 (14 Nov): 3,315 interface fires and 1,077 roadside vegetation fires in the Roma civil-protection log 2013-2022; the official R3-R4 interface map had no use case."

  nightlife_check:
    title: {it: "Movida e vivibilità notturna", en: "Nightlife and night-time liveability"}
    summary: {it: "Zone movida ufficiali, classe acustica e limiti, folla dal Wi-Fi pubblico, siti sensibili, trasporti e ordinanze.",
              en: "Official nightlife zones, noise class and limits, crowd from public Wi-Fi, sensitive sites, transit and ordinances."}
    tiers: [office]
    needs: [place]
    prompt: nightlife
    params:
      radius_m: {default: 300, basis: "The streets around a square where nightlife crowds gather; not a legal distance."}
      spot_radius_m: {default: 30, basis: "The square or street front itself, so the acoustic class is the one at the place (a 300 m ring crosses several classes, live check 14 Nov)."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "the square or street"}
      - {id: movida, tool: query_layer, args: {layer: movida_zones, area: "{place.circle}", limit: 30}, label: "official nightlife (movida) zones"}
      - {id: noise, tool: query_layer, args: {layer: acoustic_zoning, area: "{place.spot}", limit: 30}, label: "acoustic zoning class at the place, with its day and night limits (2002 plan)"}
      - {id: crowd, tool: query_layer, args: {layer: activity_wifi, area: "{place.circle}"}, label: "crowd now (public Wi-Fi sessions)"}
      - {id: context, tool: context_check, args: {point: "{place.point}", radius_m: "{params.radius_m}"}, label: "schools, care and health sites nearby"}
      - {id: transit, tool: query_layer, args: {layer: transit, area: "{place.circle}"}, label: "public transport nearby"}
      - {id: news, tool: news_search, args: {query: "ordinanza movida alcol orari {place} Roma"}, label: "ordinances and news (unverified)"}
      - {id: law, tool: legal_lookup, args: {question: "DPCM 14 novembre 1997 valori limite di immissione classi acustiche"}, label: "noise limits by class"}
    basis: "Round 3 (14 Nov): Roma's official movida zones and the acoustic zoning were on the GeoServer but in no use case. There is no noise sensor: the note gives the zoning limits, not measured noise."

  citizen_emergency_info:
    title: {it: "In caso di emergenza vicino a casa", en: "In an emergency near home"}
    summary: {it: "Per un indirizzo: aree di attesa del piano di protezione civile, rischio alluvione e frana, zone industriali, ospedali.",
              en: "For an address: civil-protection waiting areas, flood and landslide hazard, industrial zones, hospitals."}
    tiers: [office, citizen]
    needs: [place]
    prompt: citizen_emergency
    params:
      radius_m: {default: 800, basis: "About a 10-minute walk, the distance to a waiting area in the city plan."}
      home_radius_m: {default: 60, basis: "The building and its street front, for 'is my address in a hazard area'."}
    steps:
      - {id: place, tool: resolve_place, args: {text: "{place}"}, label: "the address"}
      - {id: waiting, tool: query_layer, args: {layer: civil_protection_areas, area: "{place.circle}", limit: 30, group_by: class_are}, label: "emergency plan areas within walking distance"}
      - {id: flood, tool: query_layer, args: {layer: flood_hazard_pgra, area: "{place.home}", limit: 30}, label: "official flood hazard areas at the address"}
      - {id: landslide, tool: query_layer, args: {layer: landslide_areas, area: "{place.home}", limit: 30}, label: "official landslide areas at the address"}
      - {id: seveso, tool: query_layer, args: {layer: seveso_damage_zones, area: "{place.home}", limit: 30}, label: "industrial-accident plan zones at the address"}
      - {id: hospitals, tool: query_layer, args: {layer: emergency_hospitals, area: "{place.municipio}", limit: 30}, label: "emergency hospitals in the municipio"}
      - {id: alerts, tool: news_search, args: {query: "allerta protezione civile Roma oggi"}, label: "current alerts (unverified)"}
    basis: "Round 3 (14 Nov): citizens rarely know their waiting area; Roma publishes 1,018 plan areas. Public, aggregated layers only."


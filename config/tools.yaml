# Assumptions used by the deterministic tools (WS4). Every number has a basis.

data_kind_by_provider_kind:
  basis: "restricted = Cartoradio, which is itself a model estimate (design proposal 9a)"
  open: real
  pa: real
  simulated: simulated
  restricted: estimated

# Rule from Alessandro (13 Nov 2026): only traffic loop sensors may be simulated.
# Any other layer whose active provider is synthetic is refused by the tools and flagged in data_status.
allowed_simulated_layers: [traffic_flow]

estimate_field:
  baseline_layer: emf_baseline              # layer name in config/providers.yaml
  baseline_value_keys: [electricField, e_field_v_per_m, field_v_per_m, value]   # electricField = WS5 / Smart Data Models key
  baseline_search_radius_m: {value: 150, basis: "one and a half Cartoradio cells (100 m, about 74 m on the ground)"}
  measurement_layer: emf_measurements      # ARPA Lazio points (real), shown as a reference, not mixed into the estimate
  measurement_search_radius_m: {value: 500, basis: "a measurement further than a few blocks away says little about this point"}
  baseline_sigma_db: {value: 3.0, basis: "assumption (C=60): Cartoradio publishes no uncertainty"}
  baseline_cap_v_per_m: {value: 15.0, basis: "Cartoradio maximum sits exactly on 15.0 in the inspected tile; treat as '15 or more' (C=55)"}
  receptor_height_m: {value: 1.5, basis: "standard head height for exposure assessment"}
  default_antenna_height_m: {value: 25.0, basis: "assumption: rooftop mast on a 7-storey building"}
  model: "free-space far field, isotropic (worst case, no antenna pattern, no building loss)"
  monte_carlo: {samples: 4000, area_samples: 400, seed: 20261113, basis: "fixed seed so results are reproducible"}
  area_max_points: {value: 400, basis: "cap on sample points for an area summary"}

geocoder:
  nominatim_url: "https://nominatim.openstreetmap.org/search"
  user_agent: "urbs-gemina/0.1 (open-source hackathon prototype)"
  timeout_s: 10
  max_results: 3

query_layer:
  default_limit: 500
  max_limit: 5000
  window_minutes: {value: 15, basis: "one provider cadence step or more for live layers"}
  belief_history_hours: {value: 3, basis: "readings older than a few relax time constants no longer move a belief layer"}
  stale_feed_minutes: {value: 15, basis: "a snapshot feed older than one query window has no live readings (WS3)"}
  aggregate_cell_m: {value: 500, basis: "citizen tier sees counts on a 500 m grid, not single sites"}

api:
  # Keys come from the environment variable URBS_API_KEYS as "key:role,key:role".
  # No key or an unknown key means the citizen tier.
  roles: [citizen, office]
  # Layers whose single records are visible to the office tier only.
  office_only_detail_layers: [antenna_register, emf_measurements]

sports:                                   # wiring of the WS10 tools (Challenge 04)
  facilities_file: processed/sports/facilities.geojson   # written by: python -m twin.modules.sports.pipeline build
  # Population comes from data/processed/census_sections.geojson (WS1): sez_id, residents, children_0_14, municipio, zone

exposure:
  # Which thresholds.yaml entry each named threshold reads, per belief layer (WS5 layer names).
  thresholds:
    emf:
      attention_value: [emf, attention_value_v_per_m]
      exposure_limit: [emf, exposure_limit_v_per_m]
    air_no2:
      no2_hourly_limit: [air_quality, no2_hourly_limit_ug_m3]
      no2_annual_limit: [air_quality, no2_annual_limit_ug_m3]
    air_pm10:
      pm10_daily_limit: [air_quality, pm10_daily_limit_ug_m3]
      pm10_annual_limit: [air_quality, pm10_annual_limit_ug_m3]
    air_pm25:
      pm25_annual_limit: [air_quality, pm25_annual_limit_ug_m3]
    air_o3:
      o3_information_1h: [air_quality, o3_information_1h_ug_m3]
      o3_alert_1h: [air_quality, o3_alert_1h_ug_m3]
      o3_target_8h: [air_quality, o3_target_8h_ug_m3]

schools_to_check:
  # Legal limit used per pollutant when ranking schools (names from exposure.thresholds above).
  # The shortest averaging period is used, the closest to the twin's near-instantaneous estimates.
  limits:
    air_no2: no2_hourly_limit
    air_pm10: pm10_daily_limit
    air_pm25: pm25_annual_limit

citizen:
  # Citizen services (mobile app): air and radio-frequency field "here", city heat maps, traffic now,
  # places open at a chosen time. Read by twin/tools/citizen.py. Legal values stay in thresholds.yaml.
  cache_minutes: {value: 30, basis: "EEA stations and the CAMS model publish hourly; a city build takes 10-50 s (network bound), so one build per half hour keeps citizen answers fast and cheap"}
  prewarm_layers: [air_no2, air_pm10, air_pm25, air_o3, emf]   # built in the background when the API starts
  heatmap_resolution: {value: 8, basis: "H3 resolution 8 (about 0.7 km2 per cell, about 3,500 cells for Rome): readable on a phone, one response for the whole city"}
  air_layers: {no2: air_no2, pm10: air_pm10, pm25: air_pm25, o3: air_o3}
  air_labels_it: {no2: "Biossido di azoto (NO2)", pm10: "Polveri sottili PM10", pm25: "Polveri fini PM2.5", o3: "Ozono (O3)"}
  emf_low_bands_v_per_m:
    value: [1.0, 3.0]
    basis: "assumption (C=60): below 1 V/m is typical urban background (Cartoradio central-Rome median about 0.6 V/m, 13 Nov 2026); 3 V/m is a fifth of the attention value. Upper bands are the legal values in thresholds.yaml"
  emf_labels_it: ["Molto basso", "Basso", "Moderato, sotto il valore di attenzione", "Sopra il valore di attenzione", "Sopra il limite di esposizione"]
  congestion:
    # Level = estimated speed / free-flow speed of the cell (1 = free flowing).
    ratio_bands: {value: [0.4, 0.6, 0.8], basis: "assumption (C=55): the usual four traffic colours of navigation apps; below 40% of free flow is a queue"}
    labels_it: ["Bloccato", "Congestionato", "Rallentato", "Scorrevole"]
    free_flow_kmh: {value: 45, basis: "the city's night-time speed in config/beliefs.yaml (road_speed prior centre), used where a cell has no road-class free-flow value"}
  places:
    default_radius_m: {value: 3000, basis: "about 15 minutes by bus or bike; the app can ask for more"}
    max_results: {value: 200, basis: "enough for a phone map; nearest first"}
  heat:
    # Heat risk today at the citizen's position, judged on the day's highest apparent ("feels like") temperature.
    caution_c: {value: 30, basis: "assumption (C=50): above about 30 degC apparent temperature heat discomfort becomes common (Steadman scale)"}
    risk_c: {value: 32, basis: "same value as config/beliefs.yaml heat.threshold_c: around 32 degC Italian heat-health bulletins start flagging risk for the elderly"}
    labels_it: ["Nessun rischio di caldo", "Caldo: attenzione", "Rischio per anziani e persone fragili", "Rischio alto: giornata molto calda"]
    walk_radius_m: {value: 1200, basis: "15 minutes on foot at 4.8 km/h along streets (config/sports.yaml reach)"}
    walk_speed_kmh: {value: 4.8, basis: "config/sports.yaml reach.walk_speed_kmh"}
    detour_factor: {value: 1.3, basis: "config/sports.yaml reach.detour_factor: street distance is about 1.3 x straight line"}
    max_places: {value: 5, basis: "a short list a person can choose from on a phone"}
    park_near_m: {value: 150, basis: "a park within about one block of the spot's centre counts as shade nearby"}
    fountain_near_m: {value: 150, basis: "a drinking fountain within about one block"}
  transport:
    stale_minutes: {value: 30, basis: "the alerts feed is republished every few minutes; older than half an hour means the source has stopped"}
    # First matching category wins (lowercase words in the notice title or text). Assumption (C=70), checked
    # by hand on the 154 notices of 13 Nov 2026.
    categories:
      sciopero: [sciopero, agitazione sindacale]
      evento: [manifestazione, corteo, maratona, evento, concerto, partita, cerimonia, giubileo]
      lavori: [lavori, cantiere, cantieri, realizzazione, tranvia, perdita idrica, manutenzione]
      chiusura: [chiusura, chiusa, chiuso, interdizione, transito vietato]
      deviazione: [deviazione, devia, modifica, percorso, viabilita, fermata spostata, fermate]
    labels_it: {sciopero: "Sciopero", evento: "Evento", lavori: "Lavori", chiusura: "Strada chiusa", deviazione: "Deviazione linea", avviso: "Avviso"}

feed_status:
  cache_minutes: {value: 5, basis: "a whole-city freshness run calls every feed (about 60 s); feeds update every 5-15 min"}

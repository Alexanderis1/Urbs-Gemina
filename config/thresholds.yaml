toxic_gas:
  # Concentration thresholds for the chemical-plume scenario (WS6), 60-minute exposure, mg/m3.
  # Italian Seveso land-use planning (DM 9 maggio 2001) uses LC50 / IDLH for its damage zones; the AEGL
  # guideline values are added to show reversible and disabling effects. Health guidelines, not legal limits,
  # except where the DM refers to them for planning.
  source: "NIOSH IDLH values (CDC); US EPA AEGL final values (60 min); DM 9 maggio 2001 (zone di danno)"
  confidence: 80
  substances:
    ammonia:   {aegl1_mg_m3: 21, aegl2_mg_m3: 111, idlh_mg_m3: 210, aegl3_mg_m3: 766, molar_mass: 17.03}
    chlorine:  {aegl1_mg_m3: 1.5, aegl2_mg_m3: 5.8, idlh_mg_m3: 29, aegl3_mg_m3: 58, molar_mass: 70.9}
    hydrogen_sulfide: {aegl1_mg_m3: 0.71, aegl2_mg_m3: 38, idlh_mg_m3: 139, aegl3_mg_m3: 70, molar_mass: 34.08}
  meaning:
    aegl1: "discomfort, reversible"
    aegl2: "irreversible or serious effects, or impaired ability to escape"
    idlh: "immediately dangerous to life or health (Seveso 'lesioni irreversibili' boundary)"
    aegl3: "life-threatening effects"

emergency_response:

# Legal thresholds. Code and prompts must read them from here, never hard-code them.
as_of: "2026-11-13"

emf:
  exposure_limit_v_per_m:
    value: 20.0
    applies_to: "3 MHz - 3 GHz, general public"
    source: "DPCM 8 luglio 2003, art. 3"
  attention_value_v_per_m:
    value: 15.0
    averaging: "24 hours"
    applies_to: "buildings with prolonged stay and their outdoor pertinences"
    source: "Legge 30 dicembre 2023, n. 214, art. 10 (raised from 6 V/m)"
    confidence: 85
    note: "The MIMIT decree of 30 July 2026 on emission-limit calculation was not read in full. Re-check."

antenna_context:
  radius_m: 300
  source: "Application form (Modello A, D.Lgs. 259/2003)"
  meaning: "Context information only. Not a prohibition (Consiglio di Stato, Sez. IV, 2021)."

air_quality:
  # Legal limit values for the protection of human health, D.Lgs. 155/2010 Annex XI (Directive 2008/50/EC).
  # Each applies to an averaging period; the twin's belief layers are near-instantaneous estimates.
  no2_hourly_limit_ug_m3:
    value: 200
    averaging: "1-hour mean, not to be exceeded more than 18 times a calendar year"
    source: "D.Lgs. 155/2010, Allegato XI"
  no2_annual_limit_ug_m3:
    value: 40
    averaging: "calendar-year mean"
    source: "D.Lgs. 155/2010, Allegato XI"
  pm10_daily_limit_ug_m3:
    value: 50
    averaging: "24-hour mean, not to be exceeded more than 35 times a calendar year"
    source: "D.Lgs. 155/2010, Allegato XI"
  pm10_annual_limit_ug_m3:
    value: 40
    averaging: "calendar-year mean"
    source: "D.Lgs. 155/2010, Allegato XI"
  pm25_annual_limit_ug_m3:
    value: 25
    averaging: "calendar-year mean"
    source: "D.Lgs. 155/2010, Allegato XI"

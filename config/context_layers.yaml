# Layers checked by context_check for Challenge 02 (antenna permits).
# Keys match WS1's config/ingest.yaml (files data/processed/<key>.geojson, or data/raw/<key>.geojson).
# A layer that is listed here but not downloaded yet is reported "not_available", never as empty.
basis: "Challenge 02 brief and docs/data-inventory.md (300 m context: sensitive sites and constraints)"

# Property names tried in order to label a hit. denominazione (schools), DESCRIZION (hospitals) and denom (UNESCO)
# were read from the GeoServer on 2026-11-13; the rest are fallbacks.
name_fields: [denominazione, DESCRIZION, denom, nome, NOME, denominazione, DENOMINAZIONE, denominazi, DENOMINAZI, name, NAME, descrizione, DESCRIZIONE, tipo, TIPO]

groups:
  sensitive_site: "Sensitive sites (schools, care, health, play areas)"
  constraint: "Planning, landscape and heritage constraints"
  existing_infrastructure: "Existing radio infrastructure"

layers:
  schools_state:        {label: "State schools", group: sensitive_site, data_kind: real}
  nidi:                 {label: "Municipal nurseries (nidi)", group: sensitive_site, data_kind: real}
  infanzia:             {label: "Municipal pre-schools", group: sensitive_site, data_kind: real}
  hospitals:            {label: "Hospitals", group: sensitive_site, data_kind: real}
  health_care:          {label: "Health and care facilities (Roma 241)", group: sensitive_site, data_kind: real}
  care_homes_osm:       {label: "Care homes (RSA, OpenStreetMap)", group: sensitive_site, data_kind: real}
  playgrounds_osm:      {label: "Playgrounds (OpenStreetMap)", group: sensitive_site, data_kind: real}
  unesco:               {label: "UNESCO World Heritage site", group: constraint, data_kind: real}
  unesco_buffer:        {label: "UNESCO buffer zone", group: constraint, data_kind: real}
  protected_areas:      {label: "Protected areas", group: constraint, data_kind: real}
  natura2000:           {label: "Natura 2000 sites", group: constraint, data_kind: real}
  rete_ecologica_poly:  {label: "Ecological network (areas)", group: constraint, data_kind: real}
  rete_ecologica_line:  {label: "Ecological network (lines)", group: constraint, data_kind: real}
  cpq_morfologie:       {label: "Carta per la Qualita: urban morphologies", group: constraint, data_kind: real}
  cpq_preesistenze:     {label: "Carta per la Qualita: archaeological and historic remains", group: constraint, data_kind: real}
  cpq_spazi_aperti:     {label: "Carta per la Qualita: open spaces", group: constraint, data_kind: real}
  cpq_edilizia_speciale: {label: "Carta per la Qualita: special buildings", group: constraint, data_kind: real}
  ptpr_paesaggi_roma:   {label: "PTPR Tavola A: landscape systems", group: constraint, data_kind: real}
  ptpr_a_aree_tutela_dm: {label: "PTPR Tavola A: areas protected by ministerial decree", group: constraint, data_kind: real}
  ptpr_b_ex_1497_ab:    {label: "PTPR Tavola B: scenic beauty (ex L. 1497, a-b)", group: constraint, data_kind: real}
  ptpr_b_ex_1497_cd:    {label: "PTPR Tavola B: scenic beauty (ex L. 1497, c-d)", group: constraint, data_kind: real}
  ptpr_b_boschi:        {label: "PTPR Tavola B: woods", group: constraint, data_kind: real}
  ptpr_b_acque_pubbliche: {label: "PTPR Tavola B: public waters", group: constraint, data_kind: real}
  ptpr_b_aree_archeologiche: {label: "PTPR Tavola B: archaeological areas", group: constraint, data_kind: real}
  ptpr_b_decreti_archeologici: {label: "PTPR Tavola B: archaeological decrees", group: constraint, data_kind: real}
  ptpr_b_punti_archeologici: {label: "PTPR Tavola B: archaeological points", group: constraint, data_kind: real}
  ptpr_b_centri_storici: {label: "PTPR Tavola B: historic centres", group: constraint, data_kind: real}
  ptpr_b_aree_naturali_protette: {label: "PTPR Tavola B: protected natural areas", group: constraint, data_kind: real}
  ptpr_b_usi_civici:    {label: "PTPR Tavola B: civic-use land", group: constraint, data_kind: real}
  sitap_art136_ab:      {label: "Landscape constraint art. 136 a-b D.Lgs. 42/2004 (SITAP)", group: constraint, data_kind: real}
  sitap_art136_cd:      {label: "Landscape constraint art. 136 c-d D.Lgs. 42/2004 (SITAP)", group: constraint, data_kind: real}
  masts_osm:            {label: "Existing masts (OpenStreetMap)", group: existing_infrastructure, data_kind: real}
  prg_sistemi_regole:   {label: "PRG component (Sistemi e Regole)", group: constraint, data_kind: real}

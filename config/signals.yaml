# Citizen reports ("segnalazioni") merged into candidate live events for city staff.
# Code reads everything here; nothing below is hard-coded. Every number is an assumption with a basis.

categories:
  # Report types chosen by Alessandro (14 Nov 2026). Reports of the same type merge when they are within radius_m of
  # the event centre and within window_min of its latest report. scored: false = no "is this real" score (public events).
  # photo_required: false = description is enough. subtypes: what the resident picks inside the type.
  flood:        {label: "Allagamento o fogna", radius_m: 300, window_min: 360, scored: true, photo_required: true,
                 subtypes: {flood: "Allagamento", sewer: "Fogna o tombino"}}
  pothole:      {label: "Buca in strada", radius_m: 30, window_min: 10080, scored: true, photo_required: true}
  traffic:      {label: "Traffico e trasporti", radius_m: 400, window_min: 90, scored: true, photo_required: true,
                 subtypes: {incident: "Incidente stradale", congestion: "Traffico bloccato", bus: "Problema bus", metro: "Problema metro"}}
  roadworks:    {label: "Cantiere non in mappa", radius_m: 80, window_min: 10080, scored: true, photo_required: true}
  public_event: {label: "Evento pubblico", radius_m: 300, window_min: 720, scored: false, photo_required: false}
  basis: "assumption (C=55): a jam is seen from a few hundred metres and lasts about an hour; flooding of an underpass lasts hours; a pothole or a worksite is a fixed point that stays for days (reports a week apart are the same hole); a public event covers a square for an evening"

max_reports: 2000          # one call never clusters more than this
stale_after_min: 180       # an event with no new report for this long is shown as 'stale'
max_text_chars: 280

location_check:
  # Alessandro (14 Nov 2026): a report needs the photo's GPS and the device GPS. The two must agree.
  max_distance_m: 250            # photo GPS vs device GPS when sending
  max_age_min: 120               # photo time vs sending time
  basis: "assumption (C=55): phone GPS errors are tens of metres, up to ~200 m in narrow streets; a photo of a live event is sent within the hour or two"

confidence:
  # Log-odds model: start from the prior, multiply the odds by one likelihood ratio (LR) per piece of evidence.
  # LR > 1 supports the event, LR < 1 speaks against it, LR = 1 says nothing.
  prior: 0.15
  reporter_lr: 3.0               # each independent reporter (one account counts once)
  max_reporters_counted: 5       # more reporters beyond this add nothing (crowds copy each other)
  photo_lr: 1.3                  # each reporter who attached a photo, on top of reporter_lr
  location_power:                # how much a reporter counts, by photo-vs-device GPS check (reporter_lr ** power)
    match: 1.0
    missing: 0.5                 # older app versions or a photo without GPS: half weight in log-odds
    mismatch: 0.0                # photo taken elsewhere or long ago: the reporter adds nothing
  simulated_evidence_power: 0.5  # a twin layer fed by simulated inputs counts with LR**0.5 (half the weight in log-odds)
  checks:
    photo:
      consistent: 2.5
      inconsistent: 0.3
      unclear: 1.0
      no_photo: 1.0
    news:
      confirms: 4.0
      no_match: 1.0              # minutes after an event the news is often silent: absence is not evidence against
  levels:                        # probability bands shown to staff
    likely: 0.75
    probable: 0.45
  basis: "assumption (C=50): one citizen report alone stays 'unconfirmed' (35%, 41% with a photo whose GPS matches); two independent reporters or one report plus a twin layer that agrees reach 'probable'; three reporters, or reports plus twin plus a photo check, reach 'likely'"

twin_checks:
  # Twin layers read around the event (a square of half-size max(event radius, area_half_m)).
  # stat: max | min | mean over the cells' mean values. 'supports' and 'contradicts' are conditions on that value.
  area_half_m: 300
  traffic:
    - {layer: road_speed, stat: min, unit: km/h, supports: {op: "<=", value: 15}, contradicts: {op: ">=", value: 35},
       supports_lr: 3.0, contradicts_lr: 0.6,
       basis: "assumption: below 15 km/h on an urban arterial is a jam; above 35 km/h traffic flows (road_speed fuses simulated loops with real bus speeds)"}
    - {layer: transit_delay, stat: max, unit: s, supports: {op: ">=", value: 300}, supports_lr: 1.5,
       basis: "assumption: buses more than 5 minutes late around the place point to a jam or a bus problem (real GTFS-RT)"}
  flood:
    - {layer: rain, stat: max, unit: mm/h, supports: {op: ">=", value: 5}, contradicts: {op: "<=", value: 0.1},
       supports_lr: 3.0, contradicts_lr: 0.9,
       basis: "assumption: 5 mm/h or more is enough to flood underpasses with blocked drains; no rain lowers the odds only a little (sewer faults and burst pipes happen without rain)"}
  pothole: []
  roadworks: []
  public_event: []

screening:
  # Every report is screened by Claude before it is stored (Alessandro, 14 Nov 2026). The model only labels;
  # code decides. Citizen text and photo are untrusted data: fenced, injection-scanned, no tools, strict JSON answer.
  model_role: screen             # model chosen in config/agents.yaml models.screen
  reject_reasons: [inappropriate, offensive, personal_data, off_topic, not_matching_category, likely_false, spam]
  injection_rejects: true        # text matching config/agents.yaml injection patterns is rejected before any model call
  max_reports_per_hour: 10       # per account, anti-spam (edge function)
  basis: "Alessandro: discard inappropriate or clearly false items; a cheap model per report, the expensive check stays per event"

verify:
  # Optional check by Claude (photos + texts) and Exa (news), once per event, on an officer's request.
  model_role: signals            # model chosen in config/agents.yaml models.signals
  max_photos: 3
  max_photo_bytes: 4000000
  photo_hosts: ["supabase.co", "supabase.in"]   # photos are fetched only from Lovable Cloud storage
  max_texts: 8
  basis: "cost control: one Claude call and one Exa search per event, never per report"

maintenance:
  # Maintenance mission planner (Alessandro, 14 Nov 2026): send road and sewer crews to the reported problems,
  # ordered by distance and priority, and compare with one trip per problem. Straight-line distance times a detour
  # factor (no road network yet); every number below is an assumption with its basis.
  kinds:
    pothole: {crew: roads, service_min: 45, severity: 1.0}
    flood:   {crew: sewers, service_min: 60, severity: 1.5}
    roadworks: {crew: roads, service_min: 20, severity: 0.5}
  basis_kinds: "assumption (C=50): a cold-patch pothole repair takes 30-60 min on site; clearing a drain or sewer inlet about an hour and matters more (flooding); checking an unannounced worksite is a short inspection"
  min_confidence: 0.45       # only 'probable' or 'likely' events (or ones an officer confirmed) get a crew
  depots:
    # Placeholder depots spread over the city, to be replaced by the real municipal and ACEA yards.
    - {id: depot_nord, name: "Deposito nord (ipotetico)", lon: 12.4900, lat: 41.9500}
    - {id: depot_est, name: "Deposito est (ipotetico)", lon: 12.5600, lat: 41.8900}
    - {id: depot_sud, name: "Deposito sud (ipotetico)", lon: 12.4800, lat: 41.8300}
    - {id: depot_ovest, name: "Deposito ovest (ipotetico)", lon: 12.4100, lat: 41.8900}
  depots_basis: "hypothetical: four yards inside the GRA, one per quadrant; the real yards are not in open data"
  speed_kmh: 18              # urban van speed including traffic
  detour_factor: 1.35        # road distance / straight-line distance
  shift_hours: 6             # productive hours per crew per shift
  cost_per_crew_hour_eur: 95 # two workers plus van
  cost_per_km_eur: 0.6       # fuel and wear
  max_crews: 10
  max_items: 300
  basis: "assumption (C=45): Rome average urban speed ~18 km/h for service vans; detour factor 1.3-1.4 is typical for dense street grids; crew cost from typical Italian public works rates (two workers ~35 EUR/h each plus van)"

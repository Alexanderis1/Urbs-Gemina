[project]
name = "urbs-gemina"
version = "0.1.0"
description = "Open digital twin of Rome for the public administration (AgenticHack Rome 2026)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML"]
api = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29", "httpx>=0.27"]   # WS4: tool API (httpx for its tests)
scenarios = ["eclipse-sumo>=1.20", "numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]   # WS6: SUMO traffic; terrain, floods, plumes
# WS3 live providers: GTFS-RT protobuf, EEA parquet, radar and Cartoradio GeoTIFF reads
providers = ["gtfs-realtime-bindings>=1.0", "protobuf>=4", "pyarrow>=14", "rasterio>=1.3", "numpy>=1.24", "scipy>=1.10"]
# WS3 seed building only (python -m twin.providers.simulated.build_seeds sites).
# mapbox-vector-tile pins protobuf<7: install this group in its own environment if it clashes.
seeds = ["pmtiles>=3", "mapbox-vector-tile>=2"]
beliefs = ["numpy>=1.26", "h3>=4"]
agents = ["anthropic>=2.8"]
# Building-aware EMF physics (twin/physics); ray tracing also needs "sionna-rt==2.2.0" (Modal GPU image)
physics = ["numpy>=1.26", "scipy>=1.10", "pyarrow>=14", "mapbox-earcut>=1.0"]
raytrace = ["sionna-rt==2.2.0", "mapbox-earcut>=1.0"]
# WS2 city model: footprints, heights, terrain, PMTiles.
model = ["numpy>=1.26", "scipy>=1.11", "geopandas>=1.0", "shapely>=2.0", "pyarrow>=15", "pyproj>=3.6", "rasterio>=1.3", "tippecanoe>=2.72"]
ingest = ["geopandas>=1.0", "pyarrow>=15", "shapely>=2", "pyogrio>=0.7", "openpyxl>=3.1", "osmium>=4", "rasterio>=1.3", "pyproj>=3.6"]

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["twin", "scripts", "agents", "eval", "voice"]


# WS2 city model: its geospatial libraries (geopandas, rasterio, pyarrow, PIL...) ship without type stubs.
[[tool.mypy.overrides]]
module = ["twin.model.*", "scripts.build_city_model", "scripts.build_construction_period", "scripts.build_ground_motion", "scripts.build_lidar", "scripts.build_ortho_facts", "scripts.build_trees", "build_city_model", "build_construction_period", "build_ground_motion", "build_lidar", "build_ortho_facts", "build_trees"]
disable_error_code = ["import-untyped", "import-not-found"]

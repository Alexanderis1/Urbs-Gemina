[project]
name = "urbs-gemina"
version = "0.1.0"
description = "Open digital twin of Rome for the public administration (AgenticHack Rome 2026)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML"]
ingest = ["geopandas>=1.0", "pyarrow>=15", "shapely>=2", "pyogrio>=0.7", "openpyxl>=3.1", "osmium>=4", "rasterio>=1.3", "pyproj>=3.6"]

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["twin", "scripts"]

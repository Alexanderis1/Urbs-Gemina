[project]
name = "urbs-gemina"
version = "0.1.0"
description = "Open digital twin of Rome for the public administration (AgenticHack Rome 2026)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML"]
# WS2 city model: footprints, heights, terrain, PMTiles.
model = ["numpy>=1.26", "scipy>=1.11", "geopandas>=1.0", "shapely>=2.0", "pyarrow>=15", "pyproj>=3.6", "rasterio>=1.3", "tippecanoe>=2.72"]

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["twin", "scripts"]

# WS2 city model: geospatial libraries ship without type stubs.
[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "rasterio.*", "pyproj.*", "pyarrow.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

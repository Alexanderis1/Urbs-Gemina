# The two ElevenLabs agents. Built into API payloads by voice/agent_spec.py and pushed
# with `python -m voice.push_agent --role office|citizen`.
common:
  # basis: the voice model only relays ask_twin answers, so a fast model keeps latency low.
  # Id checked against GET /v1/convai/llm/list on 13 Nov 2026.
  llm: claude-haiku-5-5
  temperature: 0.2
  # basis: low-latency multilingual TTS model for Italian and English (C=70 on the id).
  tts_model_id: eleven_flash_v2_5
  # basis: "Fabi", native Italian male library voice for informative/educational use.
  # Found in the ElevenLabs shared library and added to the account on 13 Nov 2026.
  # Override with ELEVENLABS_VOICE_ID.
  voice_id: Ha21jUwaMwdgQvqNslSM
  # basis: Alessandro, 13 Nov 2026: Italian only. Add codes here to enable auto-switching.
  default_language: it
  other_languages: []
  timezone: Europe/Rome

office:
  name: "Urbs Gemina - Office"
  # basis: office data must not be public; the web app gets a signed URL for logged-in officers.
  private: true
  prompt_file: prompts/office.md
  client_tools: [fly_to, show_area, show_layer, show_radius, open_screen]
  first_message:
    it: "Buongiorno, sono un assistente di intelligenza artificiale di Urbs Gemina, il gemello digitale di Roma. Supporto le decisioni, non le prendo. Come posso aiutarti?"
    en: "Hello, I am an AI assistant of Urbs Gemina, the digital twin of Rome. I support decisions, I do not make them. How can I help?"

citizen:
  name: "Urbs Gemina - Citizen line"
  private: false
  prompt_file: prompts/citizen.md
  client_tools: [fly_to, show_area, show_layer, open_screen]
  first_message:
    it: "Buongiorno, sono un assistente di intelligenza artificiale del Comune di Roma, basato sul gemello digitale Urbs Gemina. Le mie risposte sono informative. Cosa vuoi sapere?"
    en: "Hello, I am an AI assistant based on Urbs Gemina, the digital twin of Rome. My answers are for information only. What would you like to know?"

# Morning briefing for one municipio: fixed questions, each answered by the orchestrator
# with tool runs. The voice layer only stitches the verified answers in this order.
# basis: design-proposal section 2 ("Brief me on my municipio this morning": live layers
# and news alerts). Edit the list here, not in code.
it:
  - topic: trasporti
    question: "Ritardi del trasporto pubblico ora in {area}: valore tipico, linee peggiori e incertezza."
  - topic: traffico
    question: "Velocità del traffico ora in {area} rispetto al solito, con incertezza."
  - topic: aria
    question: "Qualità dell'aria ora in {area}: inquinante peggiore, stazioni e incertezza."
  - topic: pioggia
    question: "Pioggia attesa nelle prossime ore in {area} dal radar."
  - topic: disservizi
    question: "Notizie e avvisi di disservizi delle ultime 24 ore che riguardano {area}, con fonte."
  - topic: dati
    question: "Quali strati dati per {area} sono reali, stimati o simulati in questo momento?"
en:
  - topic: transit
    question: "Public transport delays right now in {area}: typical value, worst lines and uncertainty."
  - topic: traffic
    question: "Road speeds right now in {area} compared with usual, with uncertainty."
  - topic: air
    question: "Air quality right now in {area}: worst pollutant, stations and uncertainty."
  - topic: rain
    question: "Rain expected in the next hours in {area} from the radar."
  - topic: disruptions
    question: "News and disruption alerts from the last 24 hours affecting {area}, with source."
  - topic: data
    question: "Which data layers for {area} are real, estimated or simulated right now?"
